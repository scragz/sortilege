<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07070b">
<meta name="description" content="A drone that is always running. Cards place constraints on a process that never stops.">
<title>Sortilege - tarot sound toy</title>

<!-- Privacy-friendly analytics by Plausible -->
<script async src="https://plausible.io/js/pa-73lToRsxIxAk-Cw8uGjdV.js"></script>
<script>
  window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
  plausible.init()
</script>

</head>
<body>

<div id="field"></div>
<div id="grain"></div>
<div id="stage"></div>
<div id="inspect"></div>

<div id="bar">
  <div id="spreads">
    <div class="legend">choose your spread</div>
    <div class="picks">
      <button class="pick" data-n="1">
        <svg viewBox="-17 -17 34 34"><circle r="4.2" class="solid"/></svg>
        <span class="cap">one</span>
      </button>
      <button class="pick" data-n="3">
        <svg viewBox="-17 -17 34 34"><circle cx="-10" r="3.4" class="solid"/><circle cx="0" r="3.4" class="solid"/><circle cx="10" r="3.4" class="solid"/></svg>
        <span class="cap">three</span>
      </button>
      <button class="pick" data-n="10">
        <svg viewBox="-17 -17 34 34"><line class="line" x1="-6" y1="-11" x2="-6" y2="11"/><line class="line" x1="-14" y1="0" x2="2" y2="0"/><line class="line" x1="11" y1="-11" x2="11" y2="11"/></svg>
        <span class="cap">cross</span>
      </button>
    </div>
  </div>
  <div id="clearWrap">
    <button class="pick" id="clearBtn">
      <svg viewBox="-17 -17 34 34"><circle class="line" r="12"/></svg>
      <span class="cap">clear</span>
    </button>
  </div>
</div>

<div id="gate"><div class="inner"><div class="ring"></div><div class="say">touch to begin</div></div></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
